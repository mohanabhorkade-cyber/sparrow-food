<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sparrowfood</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Preload critical resources -->
  <link rel="preload" as="image" href="assets/images/Sparrow_background2.png">
  <link rel="preload" as="style" href="styles.scss">
  <link rel="preload" as="font" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" crossorigin>

  <!-- Preconnect to external domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Default meta tags (will be updated by Angular) -->
  <meta name="description" content="Leading supplier of premium food ingredients, seasonings, and flavorings. Quality products for food manufacturers and culinary professionals.">
  <meta name="keywords" content="food ingredients, seasonings, flavorings, spices, food manufacturing, culinary supplies">
  <meta name="author" content="Sparrow Foods">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sparrow Foods">
  <meta property="og:image" content="https://sparrowfood.com/assets/images/og-image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">

  <!-- Mobile optimization -->
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sparrow Foods">
</head>
<body>

</body>
</html>
